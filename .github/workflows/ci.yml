# .github/workflows/ci.yml -- M12: continuous integration on windows-latest, for every push and pull request.
#
# Two jobs, so a style failure and a build failure are reported apart. "gcs" is decision D11's validator
# over src/ and tests/ -- include/'s exemption lives inside tests/validate_gcs.py, not in this file, so a
# hand run reaches the same verdict -- with clang-format 18.1.3 held to a no-op beside it. "build" is the
# definition of done every milestone since M3 has named, run by a machine: the solution at x64 Release
# with warnings as errors, the unit suite, the fixtures, the container runner and the golden runner. x64
# is the only platform (GCS a2, decision D3), so there is no matrix.
name: CI

on:
   push:
   pull_request:
   workflow_dispatch:

permissions:
   contents: read

env:
   # The converter writes UTF-8 and the runners echo it; Python on Windows would otherwise encode its own
   # stdout in the ANSI code page and fail on the first character outside it.
   PYTHONUTF8: "1"

jobs:
   gcs:
      name: GCS validator and clang-format
      runs-on: windows-latest
      timeout-minutes: 15
      steps:
         -  uses: actions/checkout@v5
         -  uses: actions/setup-python@v6
            with:
               python-version: "3.12"
         -  name: Self-test the validator
            run: python tests/validate_gcs.py --self-test
         -  name: Install clang-format 18.1.3, the release the formatter verdict is pinned to
            run: python -m pip install --disable-pip-version-check clang-format==18.1.3
         -  name: Validate src/ and tests/, with clang-format a no-op
            run: python tests/validate_gcs.py --format

   build:
      name: x64 Release build and test suites
      runs-on: windows-latest
      timeout-minutes: 45
      steps:
         -  uses: actions/checkout@v5
         -  uses: actions/setup-python@v6
            with:
               python-version: "3.12"
         -  name: Build DOCXtoMD.sln at x64 Release, warnings as errors
            shell: pwsh
            run: |
               $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
               $found = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe'
               $msbuild = $found | Select-Object -First 1
               if(-not $msbuild) { throw 'vswhere found no MSBuild on this runner' }
               & $vswhere -latest -products * -property displayName
               & $msbuild -version -nologo
               & $msbuild DOCXtoMD.sln -m -nologo -p:Configuration=Release -p:Platform=x64 -warnAsError
               if($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
         -  name: Unit suite
            run: '& .\tests\x64\Release\DOCXtoMD.Tests.exe'
         -  name: Build the fixtures
            run: python tests\make_fixtures.py
         -  name: Container runner
            run: python tests\run_container.py
         -  name: Golden runner
            run: python tests\run_golden.py
